[project]
name = "netra"
version = "0.1.0"
description = "Networked Evidence & Threat-actor Relationship Analyzer — SIH26151"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"

dependencies = [
    # ── API ────────────────────────────────
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.12",

    # ── Database ──────────────────────────
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",

    # ── Neo4j ─────────────────────────────
    "neo4j>=5.25,<6",

    # ── Event bus (Redpanda / Kafka API) ──
    "aiokafka>=0.11,<1",

    # ── Worker queue ──────────────────────
    "celery[redis]>=5.4,<6",
    "redis>=5.2,<6",

    # ── Object storage ────────────────────
    "minio>=7.2,<8",

    # ── NLP / Extraction ──────────────────
    "spacy>=3.8,<4",
    "langdetect>=1.0.9",
    "phonenumbers>=8.13",

    # ── Stylometry / ML ───────────────────
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3.2,<4",
    "torch>=2.4,<3",
    "numpy>=1.26,<3",

    # ── Reports ───────────────────────────
    "jinja2>=3.1,<4",
    "weasyprint>=63,<64",

    # ── HTTP / Tor ────────────────────────
    "httpx[socks]>=0.27,<1",

    # ── Security (OWASP) ──────────────────
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "bleach>=6.1,<7",
    "slowapi>=0.1.9,<1",

    # ── Utilities ─────────────────────────
    "orjson>=3.10,<4",
    "python-dotenv>=1.0,<2",
    "structlog>=24.4,<25",
    "mmh3>=4.1,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "httpx>=0.27",
    "ruff>=0.7,<1",
    "mypy>=1.12,<2",
    "pre-commit>=3.8,<4",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP", "ANN", "SIM", "TCH"]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "S101",    # use of assert (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
